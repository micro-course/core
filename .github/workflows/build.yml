name: build

# Пуш в prod: образ (код + prod-content) в реестр Timeweb, новая версия — коммитом в репозиторий кластера.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: paromov.registry.twcstorage.ru/micro-courses/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: micro-course/prod-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: .content
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: paromov.registry.twcstorage.ru
          username: paromov
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: content=.content
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
          secrets: sentry=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/checkout@v4
        with:
          repository: EvgenyParomov/cluster
          ssh-key: ${{ secrets.CLUSTER_DEPLOY_KEY }}
          path: .cluster
      - name: deploy
        working-directory: .cluster
        run: |
          sed -i -E "s#(${IMAGE}):[^ ]+#\1:${{ steps.tag.outputs.tag }}#g" projects/micro-courses/app.yaml
          git config user.name "micro-courses build"
          git config user.email "build@micro-courses.ru"
          git commit -am "micro-courses: core ${{ steps.tag.outputs.tag }}" || exit 0
          git push
