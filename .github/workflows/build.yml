name: build

# Пуш в prod: образ (код + prod-content) в реестр Timeweb, новая версия — коммитом в репозиторий кластера.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: paromov.registry.twcstorage.ru/micro-courses/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: micro-course/prod-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: .content
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: paromov.registry.twcstorage.ru
          username: paromov
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: content=.content
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}
          secrets: sentry=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/checkout@v4
        with:
          repository: EvgenyParomov/cluster
          ssh-key: ${{ secrets.CLUSTER_DEPLOY_KEY }}
          path: .cluster
      - name: deploy
        working-directory: .cluster
        run: |
          sed -i -E "s#(${IMAGE}):[^ ]+#\1:${{ steps.tag.outputs.tag }}#g" projects/micro-courses/app.yaml
          git config user.name "micro-courses build"
          git config user.email "build@micro-courses.ru"
          git commit -am "micro-courses: core ${{ steps.tag.outputs.tag }}" || exit 0
          git push
      - name: cleanup
        # Реестр Timeweb сам старое не чистит: оставляем KEEP последних образов, текущий не трогаем никогда.
        env:
          TOKEN: ${{ secrets.REGISTRY_PASSWORD }}
          CURRENT: ${{ steps.tag.outputs.tag }}
          KEEP: "2"
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok, cur, keep = os.environ["TOKEN"], os.environ["CURRENT"], int(os.environ["KEEP"])
          reg, repo = "https://paromov.registry.twcstorage.ru", "micro-courses/core"
          def call(url, method="GET", headers=None):
              req = urllib.request.Request(url, method=method, headers=headers or {})
              with urllib.request.urlopen(req) as r:
                  return r.status, r.headers, r.read()
          _, _, body = call("https://api.timeweb.cloud/api/v1/container-registry", headers={"Authorization": "Bearer " + tok})
          rid = next(r["id"] for r in json.loads(body)["container_registry_list"] if r["name"] == "paromov")
          _, _, body = call(f"https://api.timeweb.cloud/api/v1/container-registry/{rid}/repositories", headers={"Authorization": "Bearer " + tok})
          tags = next(r["tags"] for r in json.loads(body)["container_registries_repositories"] if r["name"] == repo)
          tags.sort(key=lambda t: t["created_at"], reverse=True)
          old = [t for t in tags[keep:] if t["tag"] != cur]
          if not old:
              print("удалять нечего"); raise SystemExit
          import base64
          basic = base64.b64encode(f"paromov:{tok}".encode()).decode()
          _, _, body = call(f"https://api.timeweb.cloud/api/v1/k8s/cr-auth?service={reg}/auth/token&scope=repository:{repo}:pull,push,delete",
                            headers={"Authorization": "Basic " + basic})
          bearer = json.loads(body)["token"]
          for t in old:
              code, _, _ = call(f"{reg}/v2/{repo}/manifests/{t['digest']}", method="DELETE", headers={"Authorization": "Bearer " + bearer})
              print("удалён", t["tag"], code)
          PY
